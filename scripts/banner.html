<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Source Serif 4"; src: url("../web/fonts/SourceSerif4-latin.woff2"); font-weight: 200 900; }
@font-face { font-family: "JetBrains Mono"; src: url("../web/fonts/JetBrainsMono-latin.woff2"); font-weight: 100 800; }
:root { --paper:#F7F6F2; --ink:#1B1C1E; --muted:#5E6166; --rule:#D6D3CB; --accent:#B3401E; }
body.dark { --paper:#141517; --ink:#E6E4DF; --muted:#9A9DA3; --rule:#34373C; --accent:#E8835F; }
html, body { margin:0; }
body { width:1280px; height:320px; background:var(--paper); color:var(--ink); font-family:"Source Serif 4", serif; box-sizing:border-box; padding:48px 64px; display:grid; grid-template-columns: 1fr 520px; gap:48px; align-items:center; }
h1 { font-size:72px; font-weight:600; margin:0 0 12px; letter-spacing:-0.02em; }
p { font-size:24px; margin:0; color:var(--muted); line-height:1.35; max-width:30ch; }
.steps { display:grid; grid-template-columns: repeat(4, 1fr); border-top:2px solid var(--ink); }
.step { padding:16px 12px 0 0; border-right:1px solid var(--rule); margin-right:12px; }
.step:last-child { border-right:0; }
.n { font-family:"JetBrains Mono", monospace; font-size:14px; color:var(--muted); }
.t { font-size:24px; font-weight:600; margin-top:4px; }
.d { font-size:15px; color:var(--muted); margin-top:4px; line-height:1.35; }
.step.hit .t { color:var(--accent); }
.foot { grid-column: 2; font-family:"JetBrains Mono", monospace; font-size:13px; color:var(--muted); margin-top:16px; }
</style></head>
<body>
<div><h1>binaudit</h1><p>Bin audits for hostels and wards: how much is in the wrong bin, and whether a sign changed it.</p></div>
<div>
  <div class="steps">
    <div class="step"><div class="n">1</div><div class="t">Audit</div><div class="d">note each item in a bin</div></div>
    <div class="step hit"><div class="n">2</div><div class="t">Measure</div><div class="d">misplaced share, 95% interval</div></div>
    <div class="step"><div class="n">3</div><div class="t">Sign</div><div class="d">name that bin's own mistakes</div></div>
    <div class="step"><div class="n">4</div><div class="t">Re-audit</div><div class="d">fewer, more, or no clear change</div></div>
  </div>
</div>
<script>if (location.hash === "#dark") document.body.classList.add("dark");</script>
</body></html>
